    const dob=view.querySelector('#dob').value, female=view.querySelector('#sex').value==='1', unit=unitSel.value;
    const h1=+view.querySelector('#h1').value||null, hin=+view.querySelector('#h2').value||null, wt=+view.querySelector('#wt').value||null;
    if(!first){ alert('Please enter a first name.'); return; }
    if(!dob){ alert('Please enter your date of birth — scores use it.'); return; }
    let heightCm=null; if(unit==='in'){ if(h1) heightCm=Math.round((h1*12+(hin||0))*2.54); } else heightCm=h1;
    const weightKg = wt==null?null : (unit==='in'? +(wt*0.4536).toFixed(1) : wt);
    const info={ first, last, birth:dob, female, unit, heightMain:h1, heightIn:hin, weight:wt, heightCm, weightKg, voice:p.voice??true, mic:p.mic };
    if (existing){ existing.profile={...existing.profile, ...info}; save(); }
    else { addProfile(info); voice.warm?.(); }
    show('home');
  };
}
function profilePicker(){
  view.innerHTML = `<button class="back" id="bkp">‹ Settings</button><h1>Profiles</h1>
    ${ROOT.profiles.map(p=>{
      const a=p.profile.birth?Math.floor((Date.now()-new Date(p.profile.birth))/31557600000):null;
      const last=p.sessions.at(-1);
      return `<div class="pcard ${p.id===ROOT.activeId?'on':''}">
        <div class="pc-main" data-id="${p.id}"><b>${p.profile.first||'Unnamed'} ${p.profile.last||''}</b><small>${a?a+' yrs · ':''}${last?'FMI '+Math.round(last.fmi):'no assessment yet'}</small></div>
        <button class="pc-del" data-del="${p.id}">✕</button></div>`;
    }).join('')}
    <button class="btn" id="add">Add a person</button>`;
  view.querySelectorAll('.pc-main').forEach(el=>el.onclick=()=>switchProfile(el.dataset.id));
  view.querySelectorAll('.pc-del').forEach(el=>el.onclick=()=>{ const id=el.dataset.del; const p=ROOT.profiles.find(x=>x.id===id); if(confirm(`Delete ${p.profile.first||'this profile'} and all their data?`)){ deleteProfile(id); if(!S) intakeScreen(); else show('settings'); } });
  view.querySelector('#bkp')?.addEventListener('click',()=>show('settings'));
  view.querySelector('#add').onclick=()=>intakeScreen();
}

/* ---------------- views ---------------- */
const view=document.getElementById('view');
function show(tab){
  if (!S && tab!=='profiles'){ intakeScreen(); document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on')); return; }
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ({home,assess,exercises,plan,posture,settings,profiles:profilePicker})[tab]?.();
}
function chart(canvas, series, range){
  const cutoff=Date.now()-range*86400000, data=S.sessions.filter(s=>s.date>=cutoff); const c=canvas.getContext('2d'); const W=canvas.width=canvas.clientWidth*2, H=canvas.height=canvas.clientHeight*2;
  c.clearRect(0,0,W,H); c.lineWidth=2; c.setLineDash([8,8]); c.strokeStyle='#26385A'; c.beginPath(); c.moveTo(0,H*0.1); c.lineTo(W,H*0.1); c.stroke(); c.setLineDash([]);
  c.fillStyle='#9AA7BD'; c.font='22px sans-serif'; c.fillText('Elite 90',12,H*0.1-8);
  if (data.length<2){ c.fillText(data.length?'One session. Trend appears after the next.':'No sessions yet.',12,H-16); return; }
  const x0=data[0].date, x1=data.at(-1).date;
  for (const [k,col] of series){ c.strokeStyle=col; c.lineWidth=4; c.beginPath(); data.forEach((s,i)=>{ const x=(s.date-x0)/(x1-x0||1)*(W-40)+20, y=H-(s[k]/100)*H*0.9-H*0.05; i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke(); }
}
function home(){
  const s=S.sessions.at(-1);
  if (!s){ view.innerHTML=`<h1>Hi ${S.profile.first||''} 👋</h1><div class="empty"><p class="ink" style="font-size:20px">No assessment yet</p><p>Prop your phone up, step back, and the coach will guide you by voice through ten short tests.</p><button class="btn" id="go">Start first assessment</button></div>`; view.querySelector('#go').onclick=runAssessment; return; }
  const g=goal(s), p=S.posture.at(-1);
  const gm=new Date(s.date).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  view.innerHTML=`<h1>Hi ${S.profile.first||''} 👋</h1>
   <div class="panel"><p>Farmaha Mobility Index · ${gm}</p><div class="big">${Math.round(s.fmi)}</div><div class="band">${g.band}</div>
   <p style="margin-top:8px">Movement age ${s.movementAge} (estimate)${g.eliteDate?` · on track for Elite by ${g.eliteDate.toLocaleDateString(undefined,{month:'short',year:'numeric'})}`:g.band!=='Elite'?` · ${Math.round(g.toElite)} points to Elite. Focus: ${g.weak}`:''}</p></div>
   <div class="grid">${[['Movement',s.overall],['Flexibility',s.flex],['Mobility',s.mob],['Balance',s.bal],['Strength',s.str],['Endurance',s.end],['Posture',p?.score]].map(([n,v])=>`<div class="stat"><b>${v==null?'–':Math.round(v)}</b><span>${n}${v==null?' (no data)':''}</span></div>`).join('')}</div>
   <h2>Regional flexibility</h2><div class="regions">${Object.entries(s.reg).map(([k,v])=>`<div><i style="background:hsl(${v*1.2} 70% 45%)"></i>${k}<br><b class="ink">${Math.round(v)}</b></div>`).join('')}</div>
   ${flagsHtml(s)}
   <div class="seg" id="rng">${[['D',1],['W',7],['M',30],['Y',365]].map(([l,d],i)=>`<button data-d="${d}" class="${i===2?'on':''}">${l}</button>`).join('')}</div>
   <canvas class="chart" id="ch"></canvas><p class="tip">Amber: FMI · Green: balance · Blue: flexibility</p>
   <h2>Badges</h2><div class="badges">${BADGES.map(([id,n])=>`<span class="${S.badges.includes(id)?'on':''}">${n}</span>`).join('')}</div>
   <button class="btn" id="go">New assessment</button>`;
  view.querySelector('#go').onclick=runAssessment;
  const cv=view.querySelector('#ch'); const rd=()=>chart(cv,[['fmi','#FFB020'],['bal','#3DDC97'],['flex','#6FA8FF']],+view.querySelector('#rng .on').dataset.d); rd();
  view.querySelectorAll('#rng button').forEach(b=>b.onclick=()=>{ view.querySelectorAll('#rng button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); rd(); });
  briefing(s,g);
}
function flagsHtml(s){ const sq=s.tests?.deepSquat; if(!sq) return ''; const out=[]; if(sq.m.kneeSym!=null) out.push(`Left–right knee symmetry ${Math.round(sq.m.kneeSym)}%`); sq.flags.forEach(f=>out.push('Risk: '+f)); if(sq.m.fatigue<0.85) out.push(`Fatigue: velocity dropped ${Math.round((1-sq.m.fatigue)*100)}% across reps`); return out.length?`<div class="panel">${out.map(x=>`<p class="ink">${x}</p>`).join('')}</div>`:''; }
function briefing(s,g){
  const k='brief.'+new Date().toDateString(); if (S[k]) return; S[k]=1; save();
  const streak=streakDays(), plan=S.plan, d=todayIdx(), today=plan?plan.days[d].map(k=>EX[k].n):[]; const adh=planAdherence();
  let t=streak>1?`Day ${streak} in a row. `:'Welcome back. '; t+=adh>=.8?`You've completed ${Math.round(adh*100)} percent of this week's plan. Excellent. `:`You're at ${Math.round(adh*100)} percent of this week's plan. Let's close the gap. `;
  if (today.length) t+='Today: '+today.slice(0,3).join(', ')+'. '; t+=`${Math.round(g.toElite)} points to Elite.`; voice.say(t);
}
function streakDays(){ let n=0; const d=new Date(); while(S.streak?.[d.toDateString()]){ n++; d.setDate(d.getDate()-1); } return n; }
function planAdherence(){ if(!S.plan) return 0; const total=S.plan.days.slice(0,todayIdx()+1).reduce((a,d)=>a+d.length,0); const done=Object.values(S.done).reduce((a,d)=>a+d.length,0); return total?Math.min(1,done/total):0; }
function assess(){
  view.innerHTML=`<h1>Assessment</h1><div class="panel"><p class="ink">Ten tests, about eight minutes. The coach speaks every instruction — turn your volume up.</p><p style="margin-top:10px">Lean the phone upright at hip height with the back camera facing you. You'll need about 3 m of space and a chair.</p></div>
  <h2>The tests</h2>${TESTS.map((t,i)=>`<div class="ex"><span style="color:var(--dim);width:22px">${i+1}</span><div>${t.title}<small>${t.ins}</small></div></div>`).join('')}
  <button class="btn" id="go">Start assessment</button><p class="tip">The app runs entirely in your browser. Video never leaves this device.</p>`;
  view.querySelector('#go').onclick=runAssessment;
}
function plan(){
  if (!S.plan){ view.innerHTML=`<h1>Daily plan</h1><div class="empty"><p class="ink" style="font-size:20px">No plan yet</p><p>Complete an assessment and Motion IQ builds a full 7-day plan from what needs work.</p><button class="btn" id="go">Start assessment</button></div>`; view.querySelector('#go').onclick=runAssessment; return; }
  const struct = S.plan.structure || dailyStructure(S.sessions.at(-1)?.subScores? S.sessions.at(-1) : {reg:{},flex:60,mob:60,bal:60,str:60});
  const d=todayIdx(), names=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const [selDay,setSel]=[window.__planDay??d, v=>window.__planDay=v];
  const day = struct[selDay] || {focus:'',blocks:[],items:[]};
  const doneCount = (S.done[selDay]||[]).length, total=day.items.length;
  view.innerHTML=`<h1>Daily plan</h1>
    <div class="panel"><p>This week</p><div class="big" style="font-size:40px">${Math.round(planAdherence()*100)}%</div><p class="tip">Completed across the days so far</p></div>
    <div class="daytabs">${struct.map((_,i)=>`<button data-i="${i}" class="${i===selDay?'on':''}">${names[i].slice(0,3)}${i===d?'•':''}</button>`).join('')}</div>
    <div class="panel">
      <p class="lbl">${selDay===d?'Today':names[selDay]} · focus</p>
      <h2 style="margin-top:2px">${day.focus}</h2>
      <p class="tip">${day.items.length} exercises · about ${dayMinutes(day)} min · ${doneCount}/${total} done</p>
    </div>
    ${day.blocks.map(b=>`<h2>${b.title}</h2>${b.items.map(k=>{const e=EX[k];const done=(S.done[selDay]||[]).includes(k);return `<div class="ex"><input type="checkbox" data-k="${k}" ${done?'checked':''}><div>${e.n}<small>${e.sets>1?e.sets+' × ':''}${e.reps?e.reps+' reps':e.hold+' s'}${e.side?' each side':''} — ${e.cue}</small></div></div>`;}).join('')}`).join('')}
    ${day.items.length?`<button class="btn" id="guide">Start guided session</button>`:''}
    <p class="tip">The guided session coaches you through the strength, balance and mobility work by voice. Warm-up and cool-down you do on your own following the cues above.</p>`;
  view.querySelectorAll('.daytabs button').forEach(b=>b.onclick=()=>{ setSel(+b.dataset.i); plan(); });
  view.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{ const k=c.dataset.k; S.done[selDay]=S.done[selDay]||[]; if(c.checked){ if(!S.done[selDay].includes(k)) S.done[selDay].push(k); S.streak=S.streak||{}; S.streak[new Date().toDateString()]=1; } else S.done[selDay]=S.done[selDay].filter(x=>x!==k); save(); });
  view.querySelector('#guide')?.addEventListener('click',async ()=>{ const keys=(struct[selDay].blocks.filter(b=>!/Warm-up|Cool-down|Restore/.test(b.title)).flatMap(b=>b.items)); if(!keys.length){ alert('This is a recovery day — follow the cues at your own pace.'); return; } const rc=await roomCalibrate(keys); if(rc.note){ voice.say(rc.note); } if(rc.ok!==false){ guided(keys); } else { alert(rc.note); show('plan'); } });
}
function posture(){
  const p=S.posture.at(-1);
  view.innerHTML=`<h1>Posture</h1>${p?`<div class="panel"><p>${new Date(p.date).toLocaleDateString()}</p><div class="big">${Math.round(p.score)}</div><p class="ink" style="margin-top:8px">${p.summary}</p><p class="tip">Forward head ${p.fwdHead.toFixed(0)}° · shoulders ${p.shRound.toFixed(0)}° · shoulder tilt ${p.shAsym.toFixed(1)} cm</p></div>`:'<div class="empty"><p>Stand side-on to the front camera for ten seconds. Don\'t fix your posture — the point is to see your default.</p></div>'}
  <button class="btn" id="go">Start 10-second check</button>`;
  view.querySelector('#go').onclick=runPosture;
}
function settings(){
  const h=S.profile.health||{}, p=S.profile;
  const a=age(), ht=p.heightCm?(p.unit==='in'?`${p.heightMain||''}'${p.heightIn||0}"`:`${p.heightCm} cm`):'—', wt=p.weight?(p.unit==='in'?`${p.weight} lb`:`${p.weight} kg`):'—';
  view.innerHTML=`<h1>Settings</h1>
  <div class="panel"><p class="lbl">Current profile</p><b style="font-size:19px">${p.first||'Unnamed'} ${p.last||''}</b>
    <p class="tip">${a?a+' yrs · ':''}${ht} · ${wt}${ROOT.profiles.length>1?` · ${ROOT.profiles.length} people on this device`:''}</p>
    <div class="row"><button class="btn quiet" id="editp">Edit details</button><button class="btn quiet" id="switchp">Switch / add person</button></div>
  </div>
  <div class="toggle"><span>Voice guidance (spoken coaching)</span><input type="checkbox" id="voice" ${S.profile.voice?'checked':''}></div>
    <div class="toggle"><span>Voice control (say “start”, “pause”…)${listener.supported?'':' — not supported on this browser'}</span><input type="checkbox" id="mic" ${S.profile.mic?'checked':''} ${listener.supported?'':'disabled'}></div>
  <p class="tip">Voice commands during a session: “start”, “pause”, “resume”, “next”, “skip”, “redo”, “flip camera”, “how do I do this”. Tap the mic on the camera screen to start listening. On iPhone, speech is transcribed by Apple (like Siri dictation); leave this off if you prefer nothing leaves the device.</p>
  <h2>Endurance (from your watch or Health app)</h2>
  <label class="f">VO₂ max (ml/kg/min)<input type="number" id="vo2" value="${h.vo2||''}" inputmode="decimal"></label>
  <label class="f">Resting heart rate<input type="number" id="rhr" value="${h.rhr||''}" inputmode="numeric"></label>
  <label class="f">Active minutes last 7 days<input type="number" id="mins" value="${h.mins||''}" inputmode="numeric"></label>
  <label class="f">Average daily steps<input type="number" id="steps" value="${h.steps||''}" inputmode="numeric"></label>
  <p class="tip">Fill these in before an assessment and the Endurance score joins the index. Leave blank and the index renormalises without it.</p>
  <h2>Your data</h2><p>Everything is stored in this browser on this device. Video is never saved or sent anywhere. Export a backup to move your history to another device.</p>
  <button class="btn quiet" id="exp">Export backup</button><button class="btn quiet" id="imp">Import backup</button><input type="file" id="file" accept=".json" hidden>
  <button class="btn quiet" id="del" style="color:var(--warn)">Delete all my data</button>
  <p class="tip" style="margin-top:20px">Motion IQ gives wellness estimates from a single phone camera, not medical measurements. Angles are typically within 3–8° in the side plane and less reliable for rotation.</p>`;
  const bind=(id,fn)=>view.querySelector('#'+id).onchange=e=>{fn(e.target);save();};
  view.querySelector('#editp').onclick=()=>intakeScreen(S); view.querySelector('#switchp').onclick=()=>profilePicker();
  bind('voice',e=>S.profile.voice=e.checked); bind('mic',e=>{S.profile.mic=e.checked; if(!e.checked) listener.off();});
  for (const k of ['vo2','rhr','mins','steps']) bind(k,e=>{S.profile.health=S.profile.health||{};S.profile.health[k]=+e.value||null;S.profile.health.female=S.profile.female;S.profile.health.age=age();});
  view.querySelector('#exp').onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})); a.download='motioniq-backup.json'; a.click(); };
  view.querySelector('#imp').onclick=()=>view.querySelector('#file').click();
  view.querySelector('#file').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const d=JSON.parse(await f.text()); if(!d.sessions){alert('Not a Motion IQ backup.');return;} localStorage.setItem(DB,JSON.stringify(d)); location.reload(); };
  view.querySelector('#del').onclick=()=>{ if(confirm('Delete all sessions, plans and settings on this device?')){ localStorage.removeItem(DB); location.reload(); } };
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
if (!S) intakeScreen(); else show('home');
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    setInterval(() => reg.update(), 60000);               // check for a new version every minute
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw && nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) nw.postMessage('skip');
      });
    });
  }).catch(()=>{});
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!refreshing) { refreshing = true; location.reload(); } });
}
</script>
