<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1B2D">
<title>Motion IQ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0F1B2D;--panel:#182640;--ink:#F2F4F7;--dim:#9AA7BD;--amber:#FFB020;--good:#3DDC97;--warn:#FF6B6B;--line:#26385A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;overflow:hidden}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:max(16px,env(safe-area-inset-top)) 16px 16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:12px 4px 10px;font:inherit;font-size:13px}
nav button.on{color:var(--amber)}
nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
h2{font-size:19px;font-weight:600;margin:22px 0 8px}
p{color:var(--dim)} .ink{color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-weight:600;font-size:18px;background:var(--amber);color:#1a1200;margin-top:14px}
.btn.quiet{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px} .row .btn{margin-top:14px}
.panel{background:var(--panel);border-radius:16px;padding:16px;margin-top:12px}
.big{font-size:72px;font-weight:800;line-height:1;letter-spacing:-.04em}
.band{font-size:22px;color:var(--amber);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--panel);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em}
.stat span{font-size:12px;color:var(--dim)}
.regions{display:flex;gap:6px;margin-top:10px}
.regions div{flex:1;text-align:center;font-size:11px;color:var(--dim)}
.regions i{display:block;height:36px;border-radius:8px;margin-bottom:4px}
canvas.chart{width:100%;height:180px;background:var(--panel);border-radius:14px;margin-top:10px}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px;margin-top:14px}
.seg button{flex:1;border:0;background:none;color:var(--dim);padding:8px;font:inherit;border-radius:8px}
.seg button.on{background:var(--line);color:var(--ink)}
/* camera */
#cam{position:fixed;inset:0;background:#000;display:none;flex-direction:column}
#cam.on{display:flex}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}
#cue{position:absolute;left:0;right:0;top:max(24px,env(safe-area-inset-top));padding:0 20px;text-align:center;font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-.03em;text-shadow:0 2px 12px #000;color:var(--amber)}
#cue.good{color:var(--good)} #cue.warn{color:var(--warn)}
#sub{position:absolute;left:0;right:0;top:calc(max(24px,env(safe-area-inset-top)) + 110px);text-align:center;font-size:20px;color:#fff;text-shadow:0 1px 8px #000;padding:0 20px}
#camctl{position:absolute;left:16px;right:16px;bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:10px}
#camctl .btn{margin:0}
#count{position:absolute;inset:0;display:grid;place-items:center;font-size:180px;font-weight:900;color:#fff;text-shadow:0 4px 30px #000;pointer-events:none}
.ex{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ex input{width:22px;height:22px;accent-color:var(--amber)}
.ex small{display:block;color:var(--dim)}
label.f{display:block;margin-top:12px;color:var(--dim);font-size:14px}
input[type=date],input[type=number],select{width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.badges span{padding:6px 10px;border-radius:999px;background:var(--panel);font-size:13px;color:var(--dim)}
.badges span.on{background:var(--amber);color:#1a1200}
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.tip{font-size:14px;color:var(--dim);margin-top:10px}
@media (prefers-reduced-motion:no-preference){.btn:active{transform:scale(.98)}}

/* split-screen guided workout */
#cam.split .video, #cam.split #overlay{ }
#cam.split{ flex-direction:row }
#coach{ position:absolute; background:rgba(15,27,45,.92); backdrop-filter:blur(8px); overflow:auto; color:var(--ink); z-index:5 }
/* landscape: coach on the right half */
@media (orientation:landscape){ #cam.split #coach{ top:0; right:0; width:44%; height:100% } #cam.split video,#cam.split #overlay{ width:56%!important; left:0; right:auto } }
/* portrait: camera on top ~52%, coach below */
@media (orientation:portrait){ #cam.split #coach{ left:0; right:0; bottom:0; height:48%; border-top:1px solid var(--line) } #cam.split video,#cam.split #overlay{ height:52%!important; top:0; object-fit:cover } #cam.split #cue{ top:8px; font-size:30px } #cam.split #sub{ top:88px } }
.coach-scroll{ padding:14px 14px calc(80px + env(safe-area-inset-bottom)) }
#coach h2{ margin:10px 0 4px; font-size:18px }
.avatar-wrap{ background:#0c1626; border-radius:14px; padding:8px }
#coach canvas#av{ width:100%; height:160px; display:block; touch-action:none }
.av-btns{ display:flex; gap:6px; margin-top:6px }
.av-btns button{ flex:1; background:var(--line); color:var(--ink); border:0; border-radius:8px; padding:8px 0; font:inherit; font-size:13px }
.metrics{ margin:10px 0 }
.mrow{ display:grid; grid-template-columns:1fr auto 12px auto; gap:8px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line); font-size:14px }
.mrow b{ font-weight:600 } .mrow small{ color:var(--dim) } .mrow i{ width:12px; height:12px; border-radius:50% } .mrow .pc{ color:var(--dim); font-size:12px; width:44px; text-align:right }
.pill{ display:inline-block; background:var(--amber); color:#1a1200; border-radius:999px; padding:4px 12px; font-size:13px; font-weight:600; margin:6px 0 }
.two{ display:flex; gap:10px; margin-top:8px } .two>div{ flex:1; background:#0c1626; border-radius:10px; padding:10px } .two b{ display:block; font-size:15px; margin-top:2px }
.lbl{ color:var(--dim); font-size:12px } #coach ul{ margin:4px 0 0 16px; color:var(--dim); font-size:13px } #coach li{ margin:2px 0 }
/* room calibration diagram */
.roomcal{ background:var(--panel); border-radius:14px; padding:16px; margin-top:12px }
.roommeter{ height:14px; border-radius:7px; background:linear-gradient(90deg,#FF6B6B,#FFB020,#3DDC97); position:relative; margin:10px 0 }
.roommeter i{ position:absolute; top:-4px; width:6px; height:22px; background:#fff; border-radius:3px; transform:translateX(-50%) }

/* movement guide panel */
.guidepanel{ position:absolute; inset:0; z-index:20; background:rgba(15,27,45,.97); overflow:auto; display:flex }
.gp-scroll{ margin:auto; width:100%; max-width:520px; padding:24px 20px calc(24px + env(safe-area-inset-bottom)) }
.guidepanel h2{ text-align:center; margin-bottom:8px }
.guidepanel canvas#gpav{ width:100%; height:280px; display:block; background:#0c1626; border-radius:16px }
.guidepanel ul{ margin:14px 0; list-style:none }
.guidepanel li{ padding:9px 0; border-bottom:1px solid var(--line); color:var(--dim) }
.guidepanel li b{ color:var(--ink); margin-right:6px }

/* voice control */
.micbtn{ position:absolute; top:max(16px,env(safe-area-inset-top)); right:16px; z-index:15; width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:rgba(15,27,45,.8); color:var(--dim); display:grid; place-items:center }
.micbtn.on{ background:var(--amber); color:#1a1200; border-color:var(--amber); box-shadow:0 0 0 0 rgba(255,176,32,.6); animation:pulse 1.6s infinite }
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,176,32,.5)} 70%{box-shadow:0 0 0 14px rgba(255,176,32,0)} 100%{box-shadow:0 0 0 0 rgba(255,176,32,0)} }
@media (prefers-reduced-motion:reduce){ .micbtn.on{ animation:none } }
.miccap{ position:absolute; top:calc(max(16px,env(safe-area-inset-top)) + 60px); right:16px; z-index:15; max-width:60%; text-align:right; color:#fff; font-size:14px; text-shadow:0 1px 6px #000; opacity:0; transition:opacity .2s }
.miccap.show{ opacity:1 }

/* intake form + profiles + daily plan */
.row2{ display:flex; gap:10px } .row2>label{ flex:1 }
.inline{ display:flex; gap:6px } .inline input{ flex:1 }
.pcard{ display:flex; align-items:center; gap:10px; background:var(--panel); border-radius:14px; padding:14px; margin-top:10px; border:1px solid var(--line) }
.pcard.on{ border-color:var(--amber) }
.pc-main{ flex:1 } .pc-main b{ display:block } .pc-main small{ color:var(--dim) }
.pc-del{ background:none; border:0; color:var(--dim); font-size:18px; padding:8px }
.daytabs{ display:flex; gap:6px; overflow:auto; margin:12px 0; padding-bottom:4px }
.daytabs button{ flex:0 0 auto; background:var(--panel); color:var(--dim); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font:inherit; font-size:14px }
.daytabs button.on{ background:var(--amber); color:#1a1200; border-color:var(--amber) }

/* exercise library */
.disc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px }
.disc{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 12px; text-align:left; color:var(--ink); font:inherit }
.disc .di{ font-size:26px } .disc b{ display:block; margin-top:6px } .disc small{ color:var(--dim) }
.exrow{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:8px }
.exrow b{ display:block } .exrow small{ color:var(--dim) } .chev{ color:var(--dim); font-size:22px }
.back{ background:none; border:0; color:var(--amber); font:inherit; font-size:15px; padding:6px 0; margin-bottom:4px }
#exav{ width:100%; height:240px; display:block; background:#0c1626; border-radius:16px; touch-action:none }





</style>
</head>
<body>
<main id="view"></main>
<nav>
 <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Home</button>
 <button data-tab="assess"><svg viewBox="0 0 24 24"><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/><circle cx="12" cy="12" r="3"/></svg>Assess</button>
 <button data-tab="exercises"><svg viewBox="0 0 24 24"><path d="M6 12h12M4 9v6M20 9v6M8 7v10M16 7v10"/></svg>Exercise</button>
 <button data-tab="plan"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Plan</button>
 <button data-tab="posture"><svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6v8M8 10l4-2 4 2M12 14l-3 7M12 14l3 7"/></svg>Posture</button>
 <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Settings</button>
</nav>

<div id="cam">
 <video id="video" playsinline muted autoplay></video>
 <canvas id="overlay"></canvas>
 <div id="cue"></div><div id="sub"></div><div id="count"></div>
 <div id="camctl"></div>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ---------------- storage (multi-profile, on-device) ---------------- */
const DB = 'motioniq.v2';
const ROOT = loadRoot();
function loadRoot(){
  let r = JSON.parse(localStorage.getItem(DB) || 'null');
  if (!r){
    // migrate a v1 single-profile store if present
    const old = JSON.parse(localStorage.getItem('motioniq.v1') || 'null');
    if (old){ old.profile = old.profile||{voice:true}; old.id='p'+Date.now(); r = { profiles:[old], activeId:old.id }; }
    else r = { profiles:[], activeId:null };
    localStorage.setItem(DB, JSON.stringify(r));
  }
  return r;
}
function blankProfile(info){ return { id:'p'+Date.now()+Math.floor(Math.random()*999), profile:{ voice:true, ...info }, sessions:[], posture:[], plan:null, badges:[], done:{}, streak:{} }; }
// S points at the ACTIVE profile object; all existing code uses S.* unchanged.
let S = ROOT.profiles.find(p=>p.id===ROOT.activeId) || ROOT.profiles[0] || null;
const save = () => localStorage.setItem(DB, JSON.stringify(ROOT));
const age = () => S?.profile.birth ? Math.floor((Date.now()-new Date(S.profile.birth))/31557600000) : null;
function switchProfile(id){ ROOT.activeId=id; S=ROOT.profiles.find(p=>p.id===id); save(); voice.stop?.(); show('home'); }
function addProfile(info){ const p=blankProfile(info); ROOT.profiles.push(p); ROOT.activeId=p.id; S=p; save(); return p; }
function deleteProfile(id){ ROOT.profiles=ROOT.profiles.filter(p=>p.id!==id); if(ROOT.activeId===id){ ROOT.activeId=ROOT.profiles[0]?.id||null; S=ROOT.profiles[0]||null; } save(); }

/* ---------------- voice ---------------- */
const voice = (() => {
  const last = {}; let q = [], busy = false;
  const pump = () => { if (busy || !q.length || !S.profile.voice) return; const t = q.shift(); const u = new SpeechSynthesisUtterance(t); u.rate = 1; busy = true; u.onend = u.onerror = () => { busy = false; pump(); }; speechSynthesis.speak(u); };
  return {
    say(t, key, cd = 4, pri = 'normal') {
      if (!S.profile.voice) return;
      if (key) { if (last[key] && Date.now() - last[key] < cd * 1000) return; last[key] = Date.now(); }
      if (pri === 'critical') { speechSynthesis.cancel(); q = []; busy = false; }
      else if (pri === 'low' && (busy || q.length)) return;
      q.push(t); pump();
    },
    stop() { speechSynthesis.cancel(); q = []; busy = false; },
    warm() { const u = new SpeechSynthesisUtterance(''); speechSynthesis.speak(u); }  // iOS needs a user-gesture utterance
  };
})();


/* ---------------- voice command recognition ---------------- */
// A small voice remote. Listens (when enabled) and fires named commands.
// On iOS, recognition runs in bursts and auto-restarts. On desktop Chrome it can be continuous.
const listener = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec=null, want=false, handler=null, onCaption=null, restartT=null;
  const supported = !!SR;
  // command -> list of spoken phrases that trigger it
  const GRAMMAR = {
    start:['start','begin','go','ready','i am ready',"i'm ready",'lets go',"let's go"],
    pause:['pause','wait','hold on','stop for a second'],
    resume:['resume','continue','carry on','keep going'],
    stop:['stop','stop early','done','finish'],
    next:['next','next one','move on'],
    redo:['redo','again','repeat','do over','try again'],
    skip:['skip','skip this'],
    flip:['flip','flip camera','switch camera','front camera','back camera'],
    guide:['how do i do this','show me','watch again','how does it look','demonstrate'],
    louder:['louder','speak up','volume up'],
    cancel:['cancel','quit','exit','end'],
  };
  function match(text){
    const t=text.toLowerCase().trim();
    for (const cmd in GRAMMAR) for (const phrase of GRAMMAR[cmd]) if (t===phrase || t.includes(phrase)) return cmd;
    return null;
  }
  function build(){
    rec = new SR(); rec.lang = navigator.language||'en-US'; rec.interimResults=false; rec.maxAlternatives=3;
    rec.continuous = false;  // iOS ignores true; we restart manually
    rec.onresult = e => {
      for (const r of e.results){ const txt=r[0].transcript; onCaption?.(txt);
        const cmd=match(txt); if (cmd){ handler?.(cmd); break; } }
    };
    rec.onerror = e => { if (e.error==='not-allowed'||e.error==='service-not-allowed'){ want=false; onCaption?.('Mic blocked — allow microphone access'); } };
    rec.onend = () => { if (want){ restartT=setTimeout(()=>{ try{rec.start();}catch(_){}} , 250); } };
  }
  return {
    supported,
    on(){ if(!supported) return false; if(!rec) build(); want=true; try{rec.start();}catch(_){}; return true; },
    off(){ want=false; clearTimeout(restartT); try{rec?.stop();}catch(_){}; },
    set(fn){ handler=fn; },
    caption(fn){ onCaption=fn; },
    get active(){ return want; }
  };
})();

// Wire a set of {command: callback} for the current screen. Unhandled commands are ignored.
function voiceCommands(map){
  listener.set(cmd => { const fn=map[cmd]; if(fn){ voice.say('',null,0,'low'); fn(); } });
}
// The floating mic button + caption, shown on camera screens when voice control is available.
function ensureMicUI(){
  if (!listener.supported) return;
  let mic=document.getElementById('micbtn');
  if (!mic){
    mic=document.createElement('button'); mic.id='micbtn'; mic.className='micbtn';
    const cap=document.createElement('div'); cap.id='miccap'; cap.className='miccap';
    document.getElementById('cam').append(mic, cap);
    listener.caption(t=>{ cap.textContent='“'+t+'”'; cap.classList.add('show'); clearTimeout(cap._t); cap._t=setTimeout(()=>cap.classList.remove('show'),2500); });
    mic.onclick=()=>{ if(listener.active){ listener.off(); paintMic(); } else { listener.on(); S.profile.mic=true; save(); paintMic(); voice.say('Voice control on. Say start, pause, resume, next, or skip.'); } };
  }
  paintMic();
}
function paintMic(){ const m=document.getElementById('micbtn'); if(m){ m.classList.toggle('on', listener.active); m.innerHTML = listener.active ? micIcon(true) : micIcon(false); } }
function micIcon(on){ return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>`+(on?'':''); }
function removeMicUI(){ document.getElementById('micbtn')?.remove(); document.getElementById('miccap')?.remove(); }

/* ---------------- pose ---------------- */
const J = ['head','neck','leftShoulder','rightShoulder','leftElbow','rightElbow','leftWrist','rightWrist','spine','pelvis','leftHip','rightHip','leftKnee','rightKnee','leftAnkle','rightAnkle','leftFoot','rightFoot'];
const BONES = [['head','neck'],['neck','spine'],['spine','pelvis'],['neck','leftShoulder'],['leftShoulder','leftElbow'],['leftElbow','leftWrist'],['neck','rightShoulder'],['rightShoulder','rightElbow'],['rightElbow','rightWrist'],['pelvis','leftHip'],['leftHip','leftKnee'],['leftKnee','leftAnkle'],['leftAnkle','leftFoot'],['pelvis','rightHip'],['rightHip','rightKnee'],['rightKnee','rightAnkle'],['rightAnkle','rightFoot']];
const MP = { leftShoulder:11,rightShoulder:12,leftElbow:13,rightElbow:14,leftWrist:15,rightWrist:16,leftHip:23,rightHip:24,leftKnee:25,rightKnee:26,leftAnkle:27,rightAnkle:28,leftFoot:31,rightFoot:32 };
const v3 = (a,b,f=1)=>[a[0]+b[0]*f,a[1]+b[1]*f,a[2]+b[2]*f], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2];
const len=a=>Math.hypot(...a), dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l]};
const deg=r=>r*180/Math.PI;
const angle=(a,b,c)=>deg(Math.acos(Math.max(-1,Math.min(1,dot(norm(sub(a,b)),norm(sub(c,b)))))));
const fromVertical=v=>deg(Math.acos(Math.max(-1,Math.min(1,dot(norm(v),[0,1,0])))));

// One-Euro filter per joint
const filters = {};
function euro(name, x, t) {
  const f = filters[name] || (filters[name] = { x:null, dx:[0,0,0], t:null, minCut:1.2, beta:0.03 });
  if (f.x === null || t <= f.t) { f.x = x; f.t = t; return x; }
  const dt = (t - f.t) / 1000, al = c => 1/(1+1/(2*Math.PI*c*dt));
  const dx = sub(x, f.x).map(d => d/dt), aD = al(1);
  f.dx = f.dx.map((p,i)=>aD*dx[i]+(1-aD)*p);
  const a = al(f.minCut + f.beta*len(f.dx));
  f.x = f.x.map((p,i)=>a*x[i]+(1-a)*p); f.t = t; return f.x;
}
function toPose(world, norm2d, t) {
  const g = i => [world[i].x, -world[i].y, world[i].z], vis = i => norm2d[i].visibility ?? 1;
  const j = {}, c = {};
  for (const k in MP) { j[k] = g(MP[k]); c[k] = vis(MP[k]); }
  j.neck = mid(j.leftShoulder, j.rightShoulder); c.neck = Math.min(c.leftShoulder, c.rightShoulder);
  j.pelvis = mid(j.leftHip, j.rightHip); c.pelvis = Math.min(c.leftHip, c.rightHip);
  j.spine = mid(j.neck, j.pelvis); c.spine = c.pelvis;
  j.head = mid(g(7), g(8)); c.head = Math.min(vis(7), vis(8));
  for (const k of J) j[k] = euro(k, j[k], t);
  const ys = norm2d.map(p=>p.y), xs = norm2d.map(p=>p.x);
  return { t, j, c, box:{ top:Math.min(...ys), bottom:Math.max(...ys), cx:(Math.min(...xs)+Math.max(...xs))/2 }, n2d: norm2d,
           coverage: J.filter(k=>c[k]>=0.5).length / J.length };
}
function angles(p) {

const sc = (v,[poor,good]) => Math.min(100, Math.max(0, (v-poor)/(good-poor)*100));

const sym = (l,r) => { const m = Math.max(Math.abs(l),Math.abs(r)); return m ? Math.max(0,100*(1-Math.abs(l-r)/m)) : 100; };

function analyze(id, frames) {

  const S_ = f => A.map(f), mx = a => Math.max(...a), mn = a => Math.min(...a);
  switch (id) {
    case 'deepSquat': case 'overheadSquat': {
      const kL=S_(a=>a.knee.left), kR=S_(a=>a.knee.right), hip=S_(a=>a.hip.left), lean=S_(a=>a.trunkLean);
      m.kneeL=mx(kL); m.kneeR=mx(kR); m.hip=mx(hip); m.dfL=mx(S_(a=>a.df.left)); m.dfR=mx(S_(a=>a.df.right)); m.lean=mx(lean);
      m.hipVel=peakVel(t,hip); m.kneeSym=sym(m.kneeL,m.kneeR); m.reps=countReps(kL.map(x=>-x),-70); m.fatigue=fatigue(t,hip);
      if (mx(S_(a=>a.valgus.left))>4) flags.push('Left knee caved inward'); if (mx(S_(a=>a.valgus.right))>4) flags.push('Right knee caved inward');
      if (m.lean>45) flags.push('Excessive forward lean');
      const parts=[sc((m.kneeL+m.kneeR)/2,N.knee), sc(m.hip,N.hip), sc((m.dfL+m.dfR)/2,N.df)];
      if (id==='overheadSquat'){ m.shMin=mn(S_(a=>Math.min(a.sh.left,a.sh.right))); parts.push(sc(m.lean,N.thoracic), sc(m.shMin,N.sh)); }
      return { id, score:mean(parts), m, flags };
    }
    case 'forwardBend': { m.lean=mx(S_(a=>a.trunkLean)); m.hip=mx(S_(a=>a.hip.left)); return { id, score:mean([sc(m.lean,N.spineBend),sc(m.hip,N.hip)]), m, flags }; }
    case 'balanceLeft': case 'balanceRight': {
      const lifted = id==='balanceLeft'?'rightAnkle':'leftAnkle', stance = id==='balanceLeft'?'leftAnkle':'rightAnkle';
      let started=false, hold=(frames.at(-1).t-frames[0].t)/1000;
      for (const f of frames){ const up=f.j[lifted][1]-f.j[stance][1]>0.05; if(up) started=true; else if(started){ hold=(f.t-frames[0].t)/1000; break; } }
      m.hold=hold; m.sway=sway(frames.map(f=>v3(f.j.pelvis, mid(f.j.leftShoulder,f.j.rightShoulder),0.4)));

    }
    case 'shoulder': { m.L=mx(S_(a=>a.sh.left)); m.R=mx(S_(a=>a.sh.right)); m.sym=sym(m.L,m.R); if(m.sym<85) flags.push('One shoulder reaches less'); return { id, score:sc((m.L+m.R)/2,N.sh), m, flags }; }
    case 'lungeLeft': case 'lungeRight': {
      const s=id==='lungeLeft'?'left':'right', knee=S_(a=>a.knee[s]); m.knee=mx(knee); m.lean=mx(S_(a=>a.trunkLean)); m.reps=countReps(knee.map(x=>-x),-60);
      return { id, score:mean([sc(m.knee,[60,100]),sc(m.lean,N.lungeLean)]), m, flags };
    }
    case 'sitToStand': { const hip=S_(a=>a.hip.left); m.reps=countReps(hip,25); m.hipVel=peakVel(t,hip); m.fatigue=fatigue(t,hip); return { id, score:.6*sc(m.reps,N.sts)+.4*sc(m.hipVel,N.hipVel), m, flags }; }
    case 'gait': { const kL=S_(a=>a.knee.left), kR=S_(a=>a.knee.right); m.romL=mx(kL)-mn(kL); m.romR=mx(kR)-mn(kR); m.sym=sym(m.romL,m.romR); m.lean=mean(S_(a=>a.trunkLean)); return { id, score:.6*m.sym+.4*sc(m.lean,[15,3]), m, flags }; }

}
function subScores(o, end, post) {
  const g=(id,k)=>o[id]?.m[k], sq='deepSquat', reg={};
  reg.ankles=sc(((g(sq,'dfL')||0)+(g(sq,'dfR')||0))/2,N.df); reg.knees=sc(((g(sq,'kneeL')||0)+(g(sq,'kneeR')||0))/2,N.knee);
  reg.hips=sc(Math.max(g(sq,'hip')||0,g('forwardBend','hip')||0),N.hip); reg.spine=sc(g('forwardBend','lean')||0,N.spineBend);
  reg.thoracic=sc(g('overheadSquat','lean')??45,N.thoracic); reg.shoulders=o.shoulder?.score||0;
  const flex=mean(Object.values(reg)), mob=mean(['overheadSquat','lungeLeft','lungeRight','gait'].map(k=>o[k]?.score).filter(x=>x!=null));

const DAY_FOCUS = ['Lower-body strength & mobility','Balance & control','Upper-body & posture','Active recovery & flexibility','Full-body strength','Endurance & mobility','Rest & restore'];
const WARMUPS=['march','armCircles','hipCircles','bodySquat'], COOLDOWNS=['fwdFold','childPose','neckRoll','boxBreath'];
// Build 7 structured days from the deficit list. Each day = {focus, blocks:[{title,items:[keys]}]}.
function dailyStructure(sub){
  const base = weeklyPlan(sub);           // deficit-driven keys per day (existing logic)
  const byArea = k => (EX[k]?.a)||'other';
  return base.map((keys,i)=>{
    const focus = DAY_FOCUS[i];
    const strength = keys.filter(k=>byArea(k)==='strength');
    const balance  = keys.filter(k=>byArea(k)==='balance');
    const mobility = keys.filter(k=>['ankles','thoracic','hips','spine','shoulders'].includes(byArea(k)));
    const posture  = keys.filter(k=>byArea(k)==='posture');
    const cardio   = keys.filter(k=>byArea(k)==='endurance');
    const blocks=[];
    if (i!==6){
      blocks.push({title:'Warm-up (3–4 min)', items:WARMUPS.slice(0,3)});
      if (mobility.length) blocks.push({title:'Mobility focus', items:mobility});
      if (strength.length) blocks.push({title:'Strength', items:strength});
      if (balance.length)  blocks.push({title:'Balance', items:balance});
      if (posture.length)  blocks.push({title:'Posture', items:posture});
      if (cardio.length || i===5) blocks.push({title:'Endurance', items:cardio.length?cardio:['brisk']});
      blocks.push({title:'Cool-down (3–4 min)', items:COOLDOWNS.slice(0,3)});
    } else {
      blocks.push({title:'Restore', items:['childPose','fwdFold','boxBreath','neckRoll']});
    }
    // de-dupe keys within a day
    const seen=new Set();
    blocks.forEach(b=>b.items=b.items.filter(k=>EX[k] && !seen.has(k) && seen.add(k)));
    return { focus, blocks, items: blocks.flatMap(b=>b.items) };
  });
}
function dayMinutes(day){ // rough time estimate
  let s=0; for(const k of day.items){ const e=EX[k]; if(!e)continue; s += e.hold? (e.hold*e.sets/60) : (e.sets*(e.reps||10)*3/60); s += 0.5; } return Math.round(s);
}

function goal(sub) {
  const h=S.sessions, cur=h.at(-1)?.fmi||0, b=band(cur);
  const next={ 'Needs work':['Fair',60], Fair:['Good',70], Good:['Excellent',80], Excellent:['Elite',90], Elite:[null,100] }[b];
  const pts=h.slice(-8); let trend=0;
  if (pts.length>=2){ const t0=pts[0].date, x=pts.map(p=>(p.date-t0)/604800000), y=pts.map(p=>p.fmi), mx=mean(x), my=mean(y);
    const num=x.reduce((a,xi,i)=>a+(xi-mx)*(y[i]-my),0), den=x.reduce((a,xi)=>a+(xi-mx)**2,0); trend=den?num/den:0; }
  let eliteDate=null; if (cur<90&&trend>0.05) eliteDate=new Date(Date.now()+(90-cur)/trend*604800000);
  const areas=[['flexibility',sub.flex],['mobility',sub.mob],['balance',sub.bal],['strength',sub.str]]; if(sub.end!=null) areas.push(['endurance',sub.end]);
  for (const k in sub.reg) areas.push([k+' flexibility',sub.reg[k]]);
  const weak=areas.reduce((a,b)=>b[1]<a[1]?b:a);
  return { cur, band:b, nextBand:next[0], toNext:Math.max(0,next[1]-cur), toElite:Math.max(0,90-cur), trend, eliteDate, weak:weak[0], weakScore:weak[1] };
}
function sessionSummary(prev, s, g, mAge) {
  let t=`Session complete. Your Farmaha Mobility Index is ${Math.round(g.cur)}, which is ${g.band}. `;
  const a=age(); if (a) t+= mAge<a?`Your movement age is ${mAge}, ${a-mAge} years younger than you are. `: mAge>a?`Your movement age is ${mAge}, ${mAge-a} years above your age. We can bring that down. `:`Your movement age matches your actual age. `;
  if (prev){ const d=[['flexibility',s.flex-prev.flex],['mobility',s.mob-prev.mob],['balance',s.bal-prev.bal],['strength',s.str-prev.str]];
    const best=d.reduce((x,y)=>y[1]>x[1]?y:x), worst=d.reduce((x,y)=>y[1]<x[1]?y:x);
    if (best[1]>=2) t+=`Biggest gain: ${best[0]}, up ${Math.round(best[1])} points. `; if (worst[1]<=-3) t+=`${worst[0]} slipped ${Math.round(-worst[1])} points. Watch that. `; }
  t+=`Your weakest area is ${g.weak} at ${Math.round(g.weakScore)}. This week's plan targets it. `;
  if (g.nextBand) t+=`You're ${Math.round(g.toNext)} points from ${g.nextBand}. `;
  if (g.band==='Elite') t+=`You're Elite. The job now is to keep it.`; else if (g.eliteDate) t+=`At your current pace you'd reach Elite around ${g.eliteDate.toLocaleDateString(undefined,{month:'long',year:'numeric'})}.`; else if (S.sessions.length>1) t+=`Your trend is flat. Consistency with the daily plan is what moves the needle.`;
  return t;
}

function weeklyPlan(s) {
  const pool=[]; const add=(score,keys)=>{ if(score<70) keys.forEach(k=>pool.push([k,70-score])); };
  add(s.reg.ankles??100,['calf','kneeWall','squatHold']); add(s.reg.thoracic??100,['openBook','catCow','tRot']); add(s.reg.hips??100,['hipFlex','nn']);
  add(s.reg.spine??100,['floss','catCow']); add(s.reg.shoulders??100,['cars','wall']); add(s.str,['bridge','split','stepUp']); add(s.bal,['sls','tandem','tree']);
  add(s.end??100,['brisk']); add(s.post??100,['chin','wall']);
  if (!pool.length) pool.push(['cars',1],['nn',1],['sls',1],['bridge',1]);
  const best={}; for (const [k,p] of pool) if ((best[k]??-1)<p) best[k]=p;
  const ranked=Object.entries(best).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,8);
  const days=Array.from({length:7},()=>[]);
  ranked.forEach((k,i)=>{ const f=i<3?4:3; const set=new Set(); for(let n=0;n<f;n++) set.add((Math.floor(n*7/f)+i)%6); set.forEach(d=>days[d].push(k)); });
  days[6]=['catCow','nn','cars'];

}

async function ensureModel() {
  if (landmarker) return;
  setCue('Loading motion model…','');
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await PoseLandmarker.createFromOptions(vision, { baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task', delegate:'GPU' }, runningMode:'VIDEO', numPoses:1 });

async function openCamera(facing='environment') {
  await ensureModel();
  stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720} }, audio:false });
  video.srcObject = stream; await video.play();
  document.getElementById('cam').classList.add('on');
  overlay.style.transform = facing==='user' ? 'scaleX(-1)' : 'none'; video.style.transform = overlay.style.transform;
  ensureMicUI(); if (S.profile.mic && listener.supported && !listener.active) listener.on(), paintMic();
  for (const k in filters) delete filters[k];
  let lastT=-1;
  const loop = () => {
    if (video.readyState>=2 && video.currentTime!==lastT) {
      lastT=video.currentTime; const now=performance.now();
      const r=landmarker.detectForVideo(video, now);
      overlay.width=video.videoWidth; overlay.height=video.videoHeight; ctx.clearRect(0,0,overlay.width,overlay.height);
      if (r.landmarks?.[0]) { const p=toPose(r.worldLandmarks[0], r.landmarks[0], now); draw(p); onPose?.(p); } else onPose?.(null);
    }
    rafId=requestAnimationFrame(loop);
  }; loop();
}

function closeCamera(){ cancelAnimationFrame(rafId); stream?.getTracks().forEach(t=>t.stop()); document.getElementById('cam').classList.remove('on'); onPose=null; voice.stop(); listener.set(null); removeMicUI(); countEl.textContent=''; }
function draw(p){
  const W=overlay.width,H=overlay.height, P=i=>[p.n2d[i].x*W,p.n2d[i].y*H];
  ctx.lineWidth=5; ctx.strokeStyle='rgba(255,176,32,.9)'; ctx.lineCap='round';
  const pairs=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[27,31],[24,26],[26,28],[28,32]];
  for (const [a,b] of pairs){ ctx.beginPath(); ctx.moveTo(...P(a)); ctx.lineTo(...P(b)); ctx.stroke(); }
  ctx.fillStyle='#fff'; for (const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){ const [x,y]=P(i); ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill(); }
}

async function flipCamera(){
  camFacing = camFacing==='user' ? 'environment' : 'user';
  cancelAnimationFrame(rafId); stream?.getTracks().forEach(t=>t.stop());
  const keep=onPose;  // preserve whatever handler the current step installed
  try { await openCamera(camFacing); } catch(e){ alert('Camera not available: '+e.message); return; }
  onPose=keep;
}

// Returns {region: 'ok'|'warn'|'bad'} and a list of active corrections.
function evalForm(p, spec){
  const a = angles(p), status = {}, issues = [];
  for (const r in REGION_JOINTS) status[r] = 'ok';
  if (spec) for (const c of (spec.checks||[])){
    const side = spec.side ? 'left' : null;  // simplification: check the left/front side
    let v = c.get(a, side); const [lo,hi] = c.ok;
    let level = 'ok';
    if (c.dir === 'low'){ if (v < c.warn) level = 'bad'; else if (v < lo) level = 'warn'; }
    else { const over = Math.max(lo - v, v - hi); if (over > (c.warn - hi)) level = 'bad'; else if (v < lo || v > hi) level = 'warn'; }
    if (level !== 'ok'){ if (status[c.part] !== 'bad') status[c.part] = level; issues.push({...c, level, v}); }
  }
  return { status, issues, a };
}
const COLOR = { ok:'#3DDC97', warn:'#FFB020', bad:'#FF6B6B' };
function drawColored(p, status){
  const W=overlay.width,H=overlay.height, P=i=>[p.n2d[i].x*W,p.n2d[i].y*H];
  const jointRegion = {}; for (const r in REGION_JOINTS) for (const j of REGION_JOINTS[r]) jointRegion[j]=r;
  const MPto = { 0:'head',11:'shoulders',12:'shoulders',13:'arm',14:'arm',15:'arm',16:'arm',23:'hips',24:'hips',25:'knee',26:'knee',27:'ankle',28:'ankle',31:'ankle',32:'ankle' };
  const col = i => COLOR[status[MPto[i]] || 'ok'] || '#fff';
  const pairs=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[27,31],[24,26],[26,28],[28,32]];
  ctx.lineWidth=6; ctx.lineCap='round';
  for (const [x,y] of pairs){ const g=ctx.createLinearGradient(...P(x),...P(y)); g.addColorStop(0,col(x)); g.addColorStop(1,col(y)); ctx.strokeStyle=g; ctx.beginPath(); ctx.moveTo(...P(x)); ctx.lineTo(...P(y)); ctx.stroke(); }
  for (const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){ const [x,y]=P(i); ctx.fillStyle=col(i); ctx.beginPath(); ctx.arc(x,y,8,0,7); ctx.fill(); }
}

/* ---------------- calibration ---------------- */
function calibrate(){ return new Promise(resolve=>{
  setCue('Set up','' ); subEl.textContent='Lean the phone upright at about hip height, then walk back until I can see you head to toe.';
  voice.say('Lean your phone upright at about hip height, screen facing you. Then walk back until I can see you from head to toe.','cal.start',30);
  let still=[]; const t0=performance.now();
  onPose = p => {
    if (!p){ setCue('Step into the frame'); voice.say("I can't see you yet. Step into the frame.",'cal.none',5); still=[]; return; }
    const h=p.box.bottom-p.box.top, feetOut=p.box.bottom>0.98, headOut=p.box.top<0.02;
    if (p.coverage<0.7||feetOut||headOut){ const msg=feetOut?"I can't see your feet. Step back.":headOut?'Your head is cut off. Step back.':'Step back into the frame.'; setCue(feetOut?'Step back':headOut?'Step back':'Show whole body','warn'); voice.say(msg,'cal.frame',4); still=[]; return; }
    if (h>0.92){ setCue('Step back','warn'); voice.say('A little further back.','cal.back',3); still=[]; return; }
    if (h<0.55){ setCue('Come forward','warn'); voice.say('Come forward a little.','cal.fwd',3); still=[]; return; }
    if (Math.abs(p.box.cx-0.5)>0.2){ const d=p.box.cx<0.5?'right':'left'; setCue('Move '+d,'warn'); voice.say('Move a bit to your '+d+'.','cal.center',3); still=[]; return; }
    setCue('Stop. Hold still','good'); voice.say('Stop right there. Hold still for two seconds.','cal.hold',6,'critical');
    still.push(p); if (still.length>1 && p.t-still[0].t>=2000){ onPose=null; setCue("You're set",'good'); subEl.textContent=''; voice.say("You're set. Let's begin.",null,0,'critical'); setTimeout(resolve,1200); }
  };
});}

// Reads how the body fills the frame and returns a positioning verdict.
// Also decides whether we can see the full body or should drop to upper-body mode.
function fitVerdict(p){
  if (!p) return { label:'Step into view', cls:'warn', mode:null };
  const h = p.box.bottom - p.box.top;               // fraction of frame height the body fills
  const feetOut = p.box.bottom > 0.985, headOut = p.box.top < 0.015;
  const lowerVisible = (p.c.leftAnkle>0.5 || p.c.rightAnkle>0.5) && (p.c.leftKnee>0.5 || p.c.rightKnee>0.5);
  if (headOut) return { label:'Move back — head cut off', cls:'warn', mode:null };
  if (h > 0.95 || feetOut){
    // Too tall for the frame. If we still see the upper body well, offer upper-body mode instead of nagging.
    if (!lowerVisible && (p.c.leftShoulder>0.6 && p.c.rightShoulder>0.6)) return { label:'Small space — upper-body mode', cls:'ok', mode:'upper' };
    return { label:'Move back 1 step', cls:'warn', mode:null };
  }
  if (h < 0.5) return { label:'Move forward slightly', cls:'warn', mode:'full' };
  if (Math.abs(p.box.cx-0.5) > 0.22) return { label:'Center yourself', cls:'warn', mode:'full' };
  return { label:'Perfect position', cls:'good', mode:'full' };
}
// Lighting proxy: average landmark confidence. Low = poor light / busy background.
function lightingOK(p){ if(!p) return true; return p.coverage >= 0.6; }

/* ---------------- live coaching ---------------- */
function makeCoach(id){
  let reps=0,inRep=false,best=0,holdStart=null,lastSec=-1;
  return (p,el)=>{
    if(!p) return; const a=angles(p);
    const side=id.endsWith('Left')?'left':'right';
    if (id==='deepSquat'||id==='overheadSquat'){
      const k=(a.knee.left+a.knee.right)/2, valgus=Math.max(a.valgus.left,a.valgus.right)>4, heel=(a.df.left+a.df.right)/2<5&&k>80;
      if (k>40&&!inRep){inRep=true;best=0;}
      if (inRep){ best=Math.max(best,k);
        if (k<90&&k>50){ setCue('Go lower'); voice.say('Go lower if you can.','sq.low',3,'low'); }
        if (k>=110){ setCue('Good depth','good'); voice.say('Good depth. Hold, then stand up.','sq.depth',5); }
        if (valgus){ setCue('Knees out','warn'); voice.say('Push your knees out over your toes.','sq.valgus',4); }
        if (a.trunkLean>45){ setCue('Chest up','warn'); voice.say('Chest up.','sq.chest',4); }
        if (heel){ setCue('Heels down','warn'); voice.say('Keep your heels down.','sq.heel',4); }
        if (id==='overheadSquat'&&Math.min(a.sh.left,a.sh.right)<150){ setCue('Arms up','warn'); voice.say("Arms straight up. Don't let them drift forward.",'sq.arms',4); }
        if (k<25){ inRep=false; reps++; const d=best>=120?'full depth':best>=100?'good':'shallow'; setCue(`${reps} — ${d}`,'good'); voice.say(`${reps}. ${d}.`); if(reps>=3) voice.say("That's three. Nicely done.",'sq.done',20); }
      }
    } else if (id.startsWith('lunge')){
      const k=a.knee[side]; if(k>40&&!inRep){inRep=true;best=0;}
      if (inRep){ best=Math.max(best,k); if(k<80){setCue('Lower');voice.say('Drop the back knee lower.','lg.low',3,'low');}
        if(a.trunkLean>25){setCue('Stay tall','warn');voice.say("Stay tall. Don't lean forward.",'lg.lean',4);} if(a.valgus[side]>4){setCue('Knee out','warn');voice.say('Front knee is tracking inward. Push it out.','lg.valgus',4);}
        if(k<20){inRep=false;reps++;setCue(String(reps),'good');voice.say(String(reps));} }
    } else if (id.startsWith('balance')){
      const lifted=id==='balanceLeft'?'rightAnkle':'leftAnkle', stance=id==='balanceLeft'?'leftAnkle':'rightAnkle', up=p.j[lifted][1]-p.j[stance][1]>0.05;
      if (up){ if(holdStart==null){holdStart=el; setCue('Hold steady','good'); voice.say("Foot's up. Hold steady. Eyes on one spot.",'bal.start',30);}
        const held=Math.floor(el-holdStart); if(held>0&&held%10===0&&held!==lastSec){lastSec=held;setCue(held+' s','good');voice.say(`${held} seconds. Keep going.`);}
        if(a.trunkLean>15){setCue('Shoulders over hips','warn');voice.say('Stack your shoulders over your hips.','bal.lean',5);} }
      else if (holdStart!=null){ setCue('Lift the foot','warn'); voice.say('Foot touched down. Lift it again if you can.','bal.touch',5); }
      else setCue('Lift one foot');
    } else if (id==='forwardBend'){
      if(el<1) voice.say('Keep your knees straight and reach for your toes.','fb.go',30);
      if(a.trunkLean>75){setCue('Great reach. Hold','good');voice.say('Great reach. Hold it.','fb.hold',8);} else if(a.trunkLean>40){setCue('Reach further');voice.say("Reach a little further if it's comfortable.",'fb.more',4,'low');}
      if((a.knee.left+a.knee.right)/2>15){setCue('Knees straight','warn');voice.say('Keep your knees straight.','fb.knees',4);}
    } else if (id==='shoulder'){
      const l=a.sh.left,r=a.sh.right;
      if(Math.min(l,r)>=170){setCue('Full overhead. Hold','good');voice.say('Full overhead. Hold.','sh.full',8);} else if(Math.min(l,r)<150){setCue('Reach higher');voice.say('Reach higher. Arms by your ears.','sh.more',4,'low');}
      if(Math.abs(l-r)>15){setCue((l<r?'Left':'Right')+' arm higher','warn');voice.say((l<r?'Left':'Right')+' arm is lower. Bring it up.','sh.asym',5);}
      if(a.trunkLean>15){setCue("Don't arch",'warn');voice.say("Don't arch your back to get there.",'sh.arch',5);}
    } else if (id==='sitToStand'){
      const h=a.hip.left; if(h>60&&!inRep) inRep=true; if(inRep&&h<20){inRep=false;reps++;setCue(String(reps),'good');voice.say(String(reps),null,0,'low');}
      if(Math.floor(30-el)===10&&lastSec!==10){lastSec=10;voice.say('Ten seconds left. Push!');}
      if(a.trunkLean>40&&inRep) voice.say('Try not to throw your chest forward.','sts.lean',6,'low');
    } else if (id==='gait'){ if(el<1) voice.say('Walk toward me at your normal pace.','gait.go',30); setCue('Walk'); }
  };
}
function reviewLine(o){
  const T=TESTS.find(t=>t.id===o.id).title; let s=`${T}: ${Math.round(o.score)} out of 100. `;
  if (o.m.kneeL!=null) s+=`Knee bend ${Math.round(o.m.kneeL)} left, ${Math.round(o.m.kneeR)} right. `;
  if (o.m.hold!=null) s+=`Held ${Math.round(o.m.hold)} seconds. `; if (o.id==='sitToStand') s+=`${o.m.reps} reps. `;
  if (o.m.fatigue!=null&&o.m.fatigue<0.85) s+='You slowed down noticeably at the end. Endurance work will help. ';
  for (const f of o.flags) s+=f.includes('caved')?'Your knees caved inward. We will work on hip strength. ':f.includes('lean')?'You leaned forward a lot, which usually means tight ankles or hips. ':f+'. ';
  return s+(o.score>=80?'Strong.':o.score>=60?'Solid. Room to improve.':'This is a focus area.');
}

// Animate a reference figure through a pose sequence on a canvas.
function playMoveGuide(canvas, testId, stop){
  const g = MOVE[testId]; if(!g){ return ()=>{}; }
  let i=0, t0=performance.now(), raf;
  const loop = () => {
    if (stop && stop()){ cancelAnimationFrame(raf); return; }
    const dur=1400, k=g.poses.length, phase=((performance.now()-t0)/dur)%k, idx=Math.floor(phase), frac=phase-idx;
    const a=g.poses[idx], b=g.poses[(idx+1)%k], lerp=(x,y)=>x+(y-x)*frac;
    const spec={ hipFlex:lerp(a.hipFlex||0,b.hipFlex||0), kneeFlex:lerp(a.kneeFlex||0,b.kneeFlex||0), trunk:lerp(a.trunk||0,b.trunk||0), arms:lerp(a.arms||10,b.arms||10), label:a.label };
    const az = 35 + Math.sin((performance.now()-t0)/2200)*18;   // gentle turn so depth is always visible
    drawSpecAvatar(canvas, spec, az);
    raf=requestAnimationFrame(loop);
  };
  loop();
  return ()=>cancelAnimationFrame(raf);
}

// Build a 3D stick figure (metres) from an ideal spec, then rotate by azimuth and project.
function idealSkeleton(spec){
  const d2r=x=>x*Math.PI/180, P={};
  const hipY=0.95, torso=0.55, thigh=0.45, shank=0.45, upper=0.28, fore=0.26;
  const lean=d2r(spec.trunk||0);          // forward lean tilts the torso in +Z (toward viewer-depth)
  P.pelvis=[0,hipY,0];
  const sX=Math.sin(lean), cX=Math.cos(lean);
  P.spine=[0, hipY+cX*torso*0.5, sX*torso*0.5];
  P.neck =[0, hipY+cX*torso,     sX*torso];
  P.head =[0, hipY+cX*(torso+0.2), sX*(torso+0.2)];
  const hip=d2r(spec.hipFlex||0), knee=d2r(spec.kneeFlex||0);
  for (const s of [[-1,'left'],[1,'right']]){
    const [sx,side]=s, hx=sx*0.11;
    P[side+'Hip']=[hx,hipY,0];
    // thigh swings forward (+Z) and down as hip flexes
    P[side+'Knee']=[hx, hipY-Math.cos(hip)*thigh, Math.sin(hip)*thigh];
    const shankAng=hip-knee;                 // shank hangs from the knee
    P[side+'Ankle']=[hx, P[side+'Knee'][1]-Math.cos(shankAng)*shank, P[side+'Knee'][2]+Math.sin(shankAng)*shank];
    P[side+'Foot']=[hx, P[side+'Ankle'][1]-0.04, P[side+'Ankle'][2]+0.16];
    // shoulders ride on the leaned neck, offset sideways
    P[side+'Shoulder']=[sx*0.20, P.neck[1], P.neck[2]];
    // arm: 0deg down -> 180deg overhead, swinging through +Z front
    const ang=d2r(spec.arms||12);
    P[side+'Elbow']=[sx*0.20, P.neck[1]-Math.cos(ang)*upper, P.neck[2]+Math.sin(ang)*upper*0.6];
    P[side+'Wrist']=[sx*0.20, P.neck[1]-Math.cos(ang)*(upper+fore), P.neck[2]+Math.sin(ang)*(upper+fore)*0.6];
  }
  return P;
}
function rotateProject(P, azDeg, W, H){
  const az=azDeg*Math.PI/180, out={};
  let ys=[], xs=[];
  for (const k in P){ const [x,y,z]=P[k]; const rx=x*Math.cos(az)+z*Math.sin(az); out[k]=[rx,y]; xs.push(rx); ys.push(y); }
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const sc=Math.min((W*0.7)/((maxX-minX)||1),(H*0.8)/((maxY-minY)||1));
  const ox=W/2-((minX+maxX)/2)*sc, oy=H*0.9+minY*sc; // flip Y (screen down)
  const pix={}; for (const k in out){ pix[k]=[out[k][0]*sc+ox, H*0.95-((out[k][1]-minY)*sc)]; }
  return pix;
}

// ---- human-shape (mannequin) renderer ----
// Draws a filled, rounded human figure from projected joints. `col` sets the body tint.
function drawMannequin(c, P, s, col){
  const dark=shade(col,-22), light=shade(col,16);
  const cap=(a,b,w1,w2,fill)=>{ if(!P[a]||!P[b])return; const [x1,y1]=P[a],[x2,y2]=P[b];
    const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,a1=Math.atan2(ny,nx),a2=Math.atan2(-ny,-nx);
    c.beginPath(); c.moveTo(x1+nx*w1,y1+ny*w1); c.lineTo(x2+nx*w2,y2+ny*w2);
    c.arc(x2,y2,w2,a1,a2,true); c.lineTo(x1-nx*w1,y1-ny*w1); c.arc(x1,y1,w1,a2,a1,true);
    c.closePath(); c.fillStyle=fill; c.fill(); };
  const joint=(k,r,fill)=>{ if(!P[k])return; c.beginPath(); c.arc(P[k][0],P[k][1],r,0,7); c.fillStyle=fill; c.fill(); };

  // BACK layer: right limbs (drawn first so left overlaps = depth)
  cap('rightShoulder','rightElbow',0.22*s,0.16*s,dark); cap('rightElbow','rightWrist',0.15*s,0.11*s,dark); joint('rightElbow',0.15*s,dark); joint('rightWrist',0.13*s,dark);
  cap('rightHip','rightKnee',0.30*s,0.22*s,dark); cap('rightKnee','rightAnkle',0.20*s,0.13*s,dark); joint('rightKnee',0.20*s,dark); cap('rightAnkle','rightFoot',0.13*s,0.09*s,dark);

  // TORSO: smooth trunk through shoulders and hips with a waist pinch
  if (P.leftShoulder&&P.rightShoulder&&P.leftHip&&P.rightHip){
    const ls=P.leftShoulder,rs=P.rightShoulder,lh=P.leftHip,rh=P.rightHip;
    const midSh=[(ls[0]+rs[0])/2,(ls[1]+rs[1])/2], midHip=[(lh[0]+rh[0])/2,(lh[1]+rh[1])/2];
    const waistL=[lerp2(ls,lh,.55)], waistR=[lerp2(rs,rh,.55)];
    c.beginPath();
    c.moveTo(ls[0],ls[1]);
    c.quadraticCurveTo(ls[0]-(rs[0]-ls[0])*.06, (ls[1]+lh[1])/2, waistL[0][0], waistL[0][1]);
    c.quadraticCurveTo(lh[0]-(rh[0]-lh[0])*.04, lh[1], lh[0], lh[1]);
    c.lineTo(rh[0],rh[1]);
    c.quadraticCurveTo(rh[0]+(rh[0]-lh[0])*.04, rh[1], waistR[0][0], waistR[0][1]);
    c.quadraticCurveTo(rs[0]+(rs[0]-ls[0])*.06, (rs[1]+rh[1])/2, rs[0],rs[1]);
    c.quadraticCurveTo(midSh[0], midSh[1]-0.12*s, ls[0],ls[1]);
    c.closePath(); c.fillStyle=col; c.fill();
    // shading down the center
    c.save(); c.clip(); const g=c.createLinearGradient(midSh[0],midSh[1],midHip[0],midHip[1]);
    g.addColorStop(0,light); g.addColorStop(.5,col); g.addColorStop(1,dark); c.globalAlpha=.55; c.fillStyle=g; c.fillRect(0,0,1e4,1e4); c.globalAlpha=1; c.restore();
  }
  // shoulder & hip caps to round the torso corners
  joint('leftShoulder',0.24*s,col); joint('rightShoulder',0.24*s,shade(col,-6));
  joint('leftHip',0.26*s,col); joint('rightHip',0.26*s,shade(col,-6));

  // FRONT layer: left limbs
  cap('leftShoulder','leftElbow',0.22*s,0.16*s,col); cap('leftElbow','leftWrist',0.15*s,0.11*s,col); joint('leftElbow',0.15*s,col); joint('leftWrist',0.13*s,col);
  cap('leftHip','leftKnee',0.30*s,0.22*s,col); cap('leftKnee','leftAnkle',0.20*s,0.13*s,col); joint('leftKnee',0.20*s,col); cap('leftAnkle','leftFoot',0.13*s,0.09*s,dark);

  // NECK + HEAD
  cap('neck','head',0.16*s,0.14*s,col);
  if (P.head&&P.neck){ const [hx,hy]=P.head, [nx,ny]=P.neck; const ang=Math.atan2(hy-ny,hx-nx);
    const cx=hx, cy=hy; const rx=0.34*s, ry=0.44*s;
    c.save(); c.translate(cx,cy); c.rotate(ang+Math.PI/2);
    c.beginPath(); c.ellipse(0,0,rx,ry,0,0,7); c.fillStyle=col; c.fill();
    c.beginPath(); c.ellipse(-rx*0.25,0,rx*0.5,ry*0.7,0,0,7); c.fillStyle=light; c.globalAlpha=.5; c.fill(); c.globalAlpha=1; // face-front hint
    c.restore();
  }
}
function lerp2(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16|g<<8|b)>>>0).toString(16).padStart(6,'0'); }

function renderAvatar(canvas, exKey, azDeg){
  const spec=IDEAL[exKey]||IDEAL.bridge, c=canvas.getContext('2d');
  const W=canvas.width=canvas.clientWidth*2, H=canvas.height=canvas.clientHeight*2;
  c.clearRect(0,0,W,H);
  const P=rotateProject(idealSkeleton(spec), azDeg, W, H);
  const scale=bodyScale(P);
  drawMannequin(c, P, scale, '#4FD1A6');
  c.fillStyle='#9AA7BD'; c.font='26px sans-serif'; c.textAlign='center'; c.fillText(spec.label, W/2, H*0.06);
}
// Estimate a limb-width unit from torso height so the body scales with the figure.
function bodyScale(P){ if(P.neck&&P.pelvis){ return Math.max(14, Math.hypot(P.neck[0]-P.pelvis[0], P.neck[1]-P.pelvis[1])*0.5); } return 22; }

const LEVELS = ['Rehab','Beginner','Novice','Intermediate','Advanced','Athletic','Elite'];
// Scale reps/hold by level (index 0..6); level 3 (Intermediate) = as authored.
function scaleForLevel(base, lvl){
  const f = [0.5,0.65,0.8,1,1.2,1.45,1.7][lvl] ?? 1;
  const o = {...base};
  if (o.hold) o.hold = Math.max(10, Math.round(base.hold*f/5)*5);
  if (o.reps) o.reps = Math.max(4, Math.round(base.reps*f));
  o.sets = Math.max(1, Math.min(4, Math.round((base.sets||2)*(lvl>=4?1.3:lvl<=1?0.7:1))));
  return o;
}
const VARIATION_NOTES = {
  seated:'Seated version: perform seated in a sturdy chair, same upper-body actions.',
  standing:'Standing version: perform standing tall, brace the core.',
  wall:'Wall-supported: keep a hand or back on the wall for support.',
  limited:'Limited-mobility: reduce the range, move slowly, stop before discomfort.',
  senior:'Senior-friendly: smaller range, hold a chair for balance, breathe easy.',
  joint:'Joint-friendly: pain-free range only, avoid deep end ranges.',
  athletic:'Athletic: add tempo, pause at the hardest point, or add a light load.',
};
// Register each library entry so guided()/avatar/voice can use its id as a key.
for (const ex of LIBRARY){
  EX[ex.id] = { n:ex.name, a:ex.focus, sets:ex.sets||2, reps:ex.reps||null, hold:ex.hold||null, cue:ex.cue, side:ex.side||0 };
  IDEAL[ex.id] = { ...ex.ideal, label:ex.name };
  EXKEY[ex.id] = ex.id;
  // Build a light FORM spec from focus so color coding + PT cues work generically.
  const checks = [];
  if (['strength','balance'].includes(ex.focus)) checks.push({part:'spine', get:a=>a.trunkLean, ok:[0,15], warn:26, cue:'Keep your torso tall.', why:'A stable trunk protects the spine and directs the effort to the target muscle.', bad:'Torso lean'});
  if (ex.name.toLowerCase().includes('squat')||ex.name.toLowerCase().includes('lunge')) checks.push({part:'knee', get:(a,s)=>a.valgus[s||'left'], ok:[-3,3], warn:6, cue:'Track the knee over the toes.', why:'Prevents inward knee stress.', bad:'Knee valgus'});
  FORM[ex.id] = { muscles:ex.muscles, breath:ex.breath, mistakes:ex.mistakes, checks,
                  repJoint: ex.reps && ex.focus==='strength' ? { get:(a,s)=>a.knee[s||'left'], down:x=>x>60, up:x=>x<20 } : undefined };
}
const DISCIPLINES = [...new Set(LIBRARY.map(e=>e.disc))];

async function guided(keys){
  voice.warm();
  const list = keys.map(k=>({key:k, ...EX[k], spec:FORM[k]||{}}));
  if (!list.length) return;
  try { await openCamera(camFacing); } catch(e){ alert('Camera not available: '+e.message); show('plan'); return; }

  // Build the split-screen shell over the camera view.
  const cam = document.getElementById('cam');
  const panel = document.createElement('div'); panel.id='coach'; cam.appendChild(panel);
  cam.classList.add('split');
  const wctl=()=>{ camctl.innerHTML = `<button class="btn quiet" id="gx">End</button><button class="btn quiet" id="gpause">${PAUSE.on?'Resume':'Pause'}</button><button class="btn quiet" id="gflip">Flip</button><button class="btn quiet" id="gskip">Skip</button>`; document.getElementById('gx').onclick=()=>{cancelled=true;}; document.getElementById('gskip').onclick=()=>{skip=true;}; document.getElementById('gflip').onclick=flipCamera; document.getElementById('gpause').onclick=()=>{ PAUSE.on?resumeRun():pauseFor(); wctl(); }; };
  wctl();
  let cancelled=false, skip=false;
  const wireVoice=()=>voiceCommands({ pause:()=>{if(!PAUSE.on){pauseFor();wctl();wireVoice();}}, resume:()=>{if(PAUSE.on){resumeRun();wctl();wireVoice();}}, skip:()=>{skip=true;}, cancel:()=>{cancelled=true;}, stop:()=>{skip=true;}, flip:flipCamera, next:()=>{skip=true;} }); wireVoice();

  let az = 35, dragging=false, lastX=0;   // avatar azimuth (35deg = readable 3/4)
  const cleanup = () => { closeCamera(); cam.classList.remove('split'); panel.remove(); };

  for (let i=0; i<list.length && !cancelled; i++){
    const e = list[i]; skip=false;
    const sides = e.side ? ['left','right'] : [null];
    for (let s=1; s<=e.sets && !cancelled && !skip; s++){
      for (const side of sides){
        if (cancelled||skip) break;
        renderPanel(e, {set:s, sets:e.sets, side, phase:'get ready'});
        voice.say(`${e.n}${side?', '+side+' side':''}. Set ${s}. ${e.cue}`, 'ex.intro.'+i+'.'+s, 30);

        // ---- hands-free auto-start: wait until in position & stable ~2.5 s ----
        await autoStart(e, () => cancelled||skip);
        if (cancelled||skip) break;

        if (e.hold){
          await runHold(e, side, s, () => cancelled||skip);
        } else {
          await runReps(e, side, s, () => cancelled||skip);
        }
      }
      if (s<e.sets && !cancelled && !skip){
        voice.say('Rest thirty seconds.'); await rest(30, ()=>cancelled||skip);
      }
    }
    if (!cancelled && !skip){ markDone(e.key); }
  }
  if (!cancelled){ voice.say('Session complete. Every day you do this moves your score. See you tomorrow.'); recordStreak(); }
  cleanup(); show(cancelled?'plan':'home');

  // ---- panel renderer (right side / bottom in portrait) ----
  function renderPanel(e, st){
    const m=e.spec.mistakes||[];
    panel.innerHTML = `
      <div class="coach-scroll">
        <div class="avatar-wrap">
          <canvas id="av"></canvas>
          <div class="av-btns">
            <button data-a="20">Front</button><button data-a="65">Side</button><button data-a="200">Back</button><button data-a="40">3⁄4</button>
          </div>
          <p class="tip">Drag the figure to rotate</p>
        </div>
        <h2>${e.n}</h2>
        <p class="ink">${e.cue}</p>
        <div class="metrics" id="metrics"></div>
        <div class="pill">${st.phase||''}${st.side?' · '+st.side:''} · set ${st.set}/${st.sets}</div>
        <div class="two"><div><span class="lbl">Reps/Time</span><b id="rt">–</b></div><div><span class="lbl">Muscles</span><b>${e.spec.muscles||'—'}</b></div></div>
        <p class="lbl" style="margin-top:10px">Breathing</p><p>${e.spec.breath||'Breathe steadily.'}</p>
        ${m.length?`<p class="lbl" style="margin-top:10px">Avoid</p><ul>${m.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
      </div>`;
    const av=panel.querySelector('#av');
    const paint=()=>renderAvatar(av, EXKEY[e.key]||'bridge', az);
    paint();
    panel.querySelectorAll('.av-btns button').forEach(b=>b.onclick=()=>{ az=+b.dataset.a; paint(); });
    const down=x=>{dragging=true;lastX=x;}, move=x=>{ if(dragging){ az=(az+(x-lastX)*0.5+360)%360; lastX=x; paint(); } }, up=()=>dragging=false;
    av.onmousedown=e=>down(e.clientX); window.onmousemove=e=>move(e.clientX); window.onmouseup=up;
    av.ontouchstart=e=>down(e.touches[0].clientX); av.ontouchmove=e=>{move(e.touches[0].clientX);e.preventDefault();}; av.ontouchend=up;
  }
  function updateMetrics(fm, e, side){
    const box=panel.querySelector('#metrics'); if(!box) return;
    const spec=IDEAL[EXKEY[e.key]]||{}, a=fm.a;
    const rows=[];
    if (spec.hipFlex!=null){ const cur=Math.max(a.hip.left,a.hip.right); rows.push(cmpRow('Hip flexion', cur, spec.hipFlex)); }
    if (spec.kneeFlex!=null){ const cur=(a.knee.left+a.knee.right)/2; rows.push(cmpRow('Knee flexion', cur, spec.kneeFlex)); }
    if (spec.arms!=null){ rows.push(cmpRow('Shoulder', (a.sh.left+a.sh.right)/2, spec.arms)); }
    // symmetry
    rows.push(symRow('Shoulder L/R', a.sh.left, a.sh.right));
    rows.push(symRow('Knee L/R', a.knee.left, a.knee.right));
    box.innerHTML = rows.join('');
  }
  function cmpRow(name, cur, target){
    const pct=Math.round(Math.min(100,(cur/target)*100)), dev=Math.round(cur-target);
    const col = Math.abs(dev)<=8?'#3DDC97':Math.abs(dev)<=18?'#FFB020':'#FF6B6B';
    return `<div class="mrow"><span>${name}</span><b>${Math.round(cur)}° <small>/ ${target}°</small></b><i style="background:${col}"></i><span class="pc">${pct}%</span></div>`;
  }
  function symRow(name, l, r){
    const diff=Math.round(Math.abs(l-r)), col=diff<=8?'#3DDC97':diff<=18?'#FFB020':'#FF6B6B';
    return `<div class="mrow"><span>${name}</span><b>${Math.round(l)}° · ${Math.round(r)}°</b><i style="background:${col}"></i><span class="pc">Δ${diff}°</span></div>`;
  }

  // ---- auto-start: hold in position & stable, then countdown ----
  async function autoStart(e, abort){
    setCue('Get into position'); 
    let stableSince=null, ok=false;
    await new Promise(res=>{
      onPose = p => {
        drawFrame(p, e, null);
        const v = fitVerdict(p);
        if (!lightingOK(p)) { setCue('More light needed','warn'); voice.say('The room is a little dark — I am losing track of you.','light',8); stableSince=null; return; }
        if (!p || (v.mode==='full' && v.cls!=='good')) { setCue(v.label, v.cls==='good'?'good':'warn'); stableSince=null; return; }
        // stable = low motion for 2.5 s
        const moved = motionSince(p);
        if (moved < 0.02){ if(!stableSince) stableSince=p.t; if(p.t-stableSince>2500 && !ok){ ok=true; res(); } setCue('Hold…','good'); }
        else { stableSince=null; setCue('Ready when you are',''); }
      };
      const t=setInterval(()=>{ if(abort()){ clearInterval(t); res(); } },200);
    });
    if (abort()) return;
    for (const n of [3,2,1]){ if(abort())return; countEl.textContent=n; voice.say(String(n),null,0,'critical'); await sleep(800); }
    countEl.textContent=''; voice.say('Go.',null,0,'critical');
  }

  // ---- rep-based set with live form coaching + auto-count + auto-pause ----
  async function runReps(e, side, setNo, abort){
    let reps=0, inRep=false, awayT=0, done=false;
    const target=e.reps||10, rj=e.spec.repJoint;
    const rt=()=>{ const el=panel.querySelector('#rt'); if(el) el.textContent=`${reps} / ${target}`; };
    await new Promise(res=>{
      onPose = p => {
        if (PAUSE.on){ if(p) drawColored(p, evalForm(p,e.spec).status); return; }
        if (!p){ awayT+=33; if(awayT>1500){ setCue('Paused — come back','warn'); voice.say('Come back into view.','pause',6); } return; }
        awayT=0;
        const fm = evalForm(p, e.spec);
        drawColored(p, fm.status); drawFrame(p, e, fm, true);
        updateMetrics(fm, e, side);
        // speak the single most important active correction
        speakCorrection(fm);
        if (rj){ const s=side||'left', v=rj.get(fm.a, s);
          if (rj.down(v) && !inRep) inRep=true;
          if (rj.up(v) && inRep){ inRep=false; reps++; rt(); voice.say(String(reps), null,0,'low');
            if (fm.issues.length===0) voice.say('Excellent form, keep going.','good.'+reps,6,'low');
            if (reps>=target){ done=true; res(); } }
        }
      };
      const t=setInterval(()=>{ if(abort()||done){ clearInterval(t); res(); } },200);
    });
  }
  async function runHold(e, side, setNo, abort){
    let left=e.hold, done=false;
    const rt=()=>{ const el=panel.querySelector('#rt'); if(el) el.textContent=left+' s'; };
    onPose = p => { if(PAUSE.on){ if(p) drawColored(p, evalForm(p,e.spec).status); return; } if(!p) return; const fm=evalForm(p,e.spec); drawColored(p,fm.status); drawFrame(p,e,fm,true); updateMetrics(fm,e,side); speakCorrection(fm); };
    rt();
    await new Promise(res=>{
      const t=setInterval(()=>{ if(abort()){clearInterval(t);res();return;} if(PAUSE.on){ return; } left--; rt();
        if(left===Math.floor(e.hold/2)) voice.say('Halfway. Breathe.',null,0,'low');
        if(left===5) voice.say('Five seconds.');
        if(left<=0){ clearInterval(t); res(); } },1000);
    });
    onPose=null;
  }
  async function rest(sec, abort){
    let left=sec; setCue('Rest','');
    await new Promise(res=>{ const t=setInterval(()=>{ if(abort()){clearInterval(t);res();return;} if(PAUSE.on){return;} left--; countEl.textContent=left; if(left<=0){clearInterval(t);countEl.textContent='';res();} },1000); });
  }
  function drawFrame(p, e, fm){ /* colored skeleton already drawn by caller when fm present */ if(!fm && p){ ctx.clearRect(0,0,overlay.width,overlay.height); draw(p); } }
  let lastCorr=0;
  function speakCorrection(fm){
    if (!fm.issues.length) return;
    const worst = fm.issues.sort((a,b)=> (b.level==='bad'?1:0)-(a.level==='bad'?1:0))[0];
    voice.say(worst.cue, 'corr.'+worst.part, 4, worst.level==='bad'?'normal':'low');
  }
}
// motion tracker for stability detection
let _prevPose=null;
function motionSince(p){ if(!_prevPose||!p){ _prevPose=p; return 1; } let d=0,n=0; for(const k in p.j){ if(_prevPose.j[k]){ d+=Math.hypot(...sub(p.j[k],_prevPose.j[k])); n++; } } _prevPose=p; return n?d/n:1; }
function markDone(key){ const d=todayIdx(); S.done[d]=S.done[d]||[]; if(!S.done[d].includes(key)) S.done[d].push(key); save(); }
function recordStreak(){ S.streak=S.streak||{}; S.streak[new Date().toDateString()]=1; save(); }


/* ---------------- room calibration ---------------- */
const FOOTPRINT = { // rough space each movement needs, for guidance only
  bridge:'floor', openBook:'floor', catCow:'floor', tRot:'floor', nn:'floor', floss:'floor', hipFlex:'floor',
  chin:'standing-small', cars:'standing-small', wall:'standing-small', calf:'standing-small', kneeWall:'standing-small',
  sls:'standing', tree:'standing', split:'standing', stepUp:'standing', squatHold:'standing',
  tandem:'walking', tandemWalk:'walking', brisk:'walking',
};
async function roomCalibrate(keys){
  return new Promise(async resolve=>{
    let stream2;
    try { await openCamera(camFacing); } catch(e){ resolve({ok:true, note:'Camera check skipped.'}); return; }
    camctl.innerHTML='<button class="btn quiet" id="rcx">Skip</button>';
    let cancelled=false; camctl.querySelector('#rcx').onclick=()=>{cancelled=true;};
    setCue('Room check','' ); subEl.textContent='Stand where you plan to exercise. I’ll measure your space.';
    voice.say('Stand where you plan to exercise so I can check you have enough room and light.','rc',20);
    let samples=[]; const t0=performance.now();
    await new Promise(r=>{ onPose=p=>{ if(p) samples.push({fill:p.box.bottom-p.box.top, cx:p.box.cx, cov:p.coverage, light:lightingOK(p)}); if(cancelled||performance.now()-t0>4000) r(); }; const iv=setInterval(()=>{if(cancelled){clearInterval(iv);r();}},200); });
    onPose=null; closeCamera();
    if (!samples.length){ resolve({ok:false, note:'I could not see you. Improve lighting and try again.'}); return; }
    const fill=mean(samples.map(s=>s.fill)), light=samples.filter(s=>s.light).length/samples.length>0.6;
    const needs=[...new Set(keys.map(k=>FOOTPRINT[k]||'standing'))];
    const fullBody = fill<0.9;         // whole body visible = plenty of depth
    const adequate = fullBody || !needs.includes('walking');
    let note;
    if (!light) note='Add light — a lamp facing you, or face a window. Tracking is unreliable in low light.';
    else if (!fullBody && needs.includes('walking')) note='Tight for walking drills. Point the camera along the longest wall, or swap to marching in place.';
    else if (!fullBody) note='Small space is fine for these. Upper-body mode will kick in automatically if your legs leave the frame.';
    else note='Plenty of room. Camera at hip height, angled to catch you head to toe.';
    resolve({ok:light, fullBody, note, upperOnly:!fullBody });
  });
}
